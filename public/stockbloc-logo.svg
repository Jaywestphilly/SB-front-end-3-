<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" fill="none">
  <defs>
    <!-- High quality 3D shadows and glows -->
    <filter id="sbDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#01161b" flood-opacity="0.9" />
    </filter>
    <filter id="sbSoftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients for realistic metallic chrome & neon finish -->
    <!-- 1. Yoke Gradient -->
    <linearGradient id="yokeFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#124854" />
      <stop offset="35%" stop-color="#185d6b" />
      <stop offset="70%" stop-color="#0f3c46" />
      <stop offset="100%" stop-color="#072228" />
    </linearGradient>

    <!-- 2. Neon Cyan Accent Stroke Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbfaff" />
      <stop offset="25%" stop-color="#38f0fc" />
      <stop offset="75%" stop-color="#00d8eb" />
      <stop offset="100%" stop-color="#028da0" />
    </linearGradient>

    <!-- 3. Bell Metallic Body Gradient (Horizontal Cylinder Specular) -->
    <linearGradient id="bellMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#054550" />
      <stop offset="14%" stop-color="#0d6d7c" />
      <stop offset="30%" stop-color="#2ee3f1" />
      <stop offset="46%" stop-color="#d6fcff" />
      <stop offset="58%" stop-color="#2ee3f1" />
      <stop offset="82%" stop-color="#0d6d7c" />
      <stop offset="100%" stop-color="#043841" />
    </linearGradient>

    <!-- 4. Bell Crown Gradient -->
    <linearGradient id="bellCrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8f8fd" />
      <stop offset="45%" stop-color="#2fe4f2" />
      <stop offset="100%" stop-color="#095460" />
    </linearGradient>

    <!-- 5. 'S' and 'B' Letters Chrome Cyan 3D Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4fcff" />
      <stop offset="20%" stop-color="#36edf9" />
      <stop offset="55%" stop-color="#00d5e8" />
      <stop offset="85%" stop-color="#0296a8" />
      <stop offset="100%" stop-color="#03606d" />
    </linearGradient>

    <!-- 6. Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#082930" />
      <stop offset="50%" stop-color="#114e5b" />
      <stop offset="100%" stop-color="#08333c" />
    </linearGradient>
  </defs>

  <!-- 1. TOP YOKE (Historic Liberty Bell Headstock Beam) -->
  <g filter="url(#sbDropShadow)">
    <!-- Main Yoke Body -->
    <path
      d="M 185 365 L 185 285 C 185 272 195 262 208 262 L 222 262 L 222 232 C 222 220 232 210 245 210 L 310 210 C 345 210 380 152 430 142 L 462 142 L 462 120 C 462 102 478 88 495 88 L 505 88 C 522 88 538 102 538 120 L 538 142 L 570 142 C 620 152 655 210 690 210 L 755 210 C 768 210 778 220 778 232 L 778 262 L 792 262 C 805 262 815 272 815 285 L 815 365 C 815 378 805 385 792 385 L 708 385 C 702 292 622 232 500 232 C 378 232 298 292 292 385 L 208 385 C 195 385 185 378 185 365 Z"
      fill="url(#yokeFill)"
      stroke="#02161a"
      stroke-width="12"
      stroke-linejoin="round"
    />

    <!-- Inner Neon Cyan Border Track -->
    <path
      d="M 205 360 L 205 288 L 236 288 L 236 236 L 314 236 C 352 236 388 178 436 166 L 476 166 L 476 124 C 476 114 485 106 500 106 C 515 106 524 114 524 124 L 524 166 L 564 166 C 612 178 648 236 686 236 L 764 236 L 764 288 L 795 288 L 795 360 L 722 360 C 712 278 628 214 500 214 C 372 214 288 278 278 360 Z"
      fill="none"
      stroke="url(#neonCyan)"
      stroke-width="10"
      stroke-linejoin="round"
    />

    <!-- Top Crown Accent Tab -->
    <rect x="476" y="112" width="48" height="24" rx="6" fill="#042026" stroke="url(#neonCyan)" stroke-width="4" />
  </g>

  <!-- 2. BELL CLAPPER (Spherical Weight & Stem Below) -->
  <g filter="url(#sbDropShadow)">
    <rect x="486" y="780" width="28" height="85" rx="8" fill="#093139" stroke="#031a1f" stroke-width="6" />
    <circle cx="500" cy="880" r="46" fill="#082b32" stroke="#021519" stroke-width="8" />
    <!-- Clapper 3D Specular Highlight -->
    <circle cx="486" cy="866" r="16" fill="#2fe4f2" opacity="0.85" filter="url(#sbSoftGlow)" />
    <circle cx="483" cy="863" r="6" fill="#ffffff" />
  </g>

  <!-- 3. BELL CROWN & TOP MOUNT -->
  <g filter="url(#sbDropShadow)">
    <!-- Arch Loop -->
    <path
      d="M 426 295 C 426 238 456 202 500 202 C 544 202 574 238 574 295 Z"
      fill="url(#bellCrown)"
      stroke="#04242a"
      stroke-width="10"
    />
    <!-- Loop Center Hole -->
    <path
      d="M 458 285 C 458 252 476 234 500 234 C 524 234 542 252 542 285 Z"
      fill="#041b20"
      stroke="url(#neonCyan)"
      stroke-width="5"
    />
    <!-- Mounting Collar -->
    <rect x="414" y="294" width="172" height="38" rx="12" fill="url(#neonCyan)" stroke="#031e24" stroke-width="8" />
    <rect x="424" y="302" width="152" height="8" rx="4" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- 4. LIBERTY BELL MAIN BODY -->
  <g filter="url(#sbDropShadow)">
    <!-- Flared Bell Profile -->
    <path
      d="M 432 332 C 432 332 444 374 444 424 C 444 496 428 566 388 650 C 356 714 300 764 280 782 C 370 766 630 766 720 782 C 700 764 644 714 612 650 C 572 566 556 496 556 424 C 556 374 568 332 568 332 Z"
      fill="url(#bellMetallic)"
      stroke="#021c22"
      stroke-width="14"
      stroke-linejoin="round"
    />

    <!-- Bell Bottom Rim (Sound Bow Lip) -->
    <path
      d="M 276 778 C 365 752 635 752 724 778 C 710 814 620 828 500 828 C 380 828 290 814 276 778 Z"
      fill="url(#yokeFill)"
      stroke="#02171c"
      stroke-width="10"
      stroke-linejoin="round"
    />

    <!-- Sound Bow Specular Ridge -->
    <path
      d="M 315 776 C 385 760 615 760 685 776"
      stroke="#c8fcff"
      stroke-width="7"
      stroke-linecap="round"
    />

    <!-- Vertical Specular Chrome Flare down center -->
    <path
      d="M 495 335 L 495 760"
      stroke="#ffffff"
      stroke-width="8"
      stroke-linecap="round"
      opacity="0.45"
      filter="url(#sbSoftGlow)"
    />
  </g>

  <!-- 5. THE STYLIZED "S" (Left Monogram Flank) -->
  <g filter="url(#sbDropShadow)">
    <!-- Base 3D Extrusion Shadow -->
    <path
      d="M 400 382 C 330 376 226 394 186 454 C 140 524 150 600 226 650 C 306 700 366 720 376 740 C 392 766 372 792 316 792 C 260 792 210 766 170 726 L 132 766 C 178 818 244 848 326 848 C 428 848 474 798 458 722 C 442 646 372 620 300 574 C 240 534 214 498 234 454 C 254 412 316 402 376 412 Z"
      fill="#021e24"
      transform="translate(4, 8)"
    />

    <!-- Main "S" Shape Face -->
    <path
      d="M 400 382 C 330 376 226 394 186 454 C 140 524 150 600 226 650 C 306 700 366 720 376 740 C 392 766 372 792 316 792 C 260 792 210 766 170 726 L 132 766 C 178 818 244 848 326 848 C 428 848 474 798 458 722 C 442 646 372 620 300 574 C 240 534 214 498 234 454 C 254 412 316 402 376 412 Z"
      fill="url(#letterGrad)"
      stroke="#021c22"
      stroke-width="12"
      stroke-linejoin="round"
    />

    <!-- "S" Upper Loop Inner Ridge Accent -->
    <path
      d="M 380 406 C 326 398 270 408 246 448 C 228 486 248 518 302 556 C 374 604 434 634 446 706"
      stroke="#d8fcff"
      stroke-width="8"
      stroke-linecap="round"
      fill="none"
    />

    <!-- "S" Bottom Horn Tip Accent -->
    <path
      d="M 148 756 C 188 800 248 828 324 828"
      stroke="#c2f9fd"
      stroke-width="6"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- 6. THE STYLIZED "B" (Right Monogram Flank) -->
  <g filter="url(#sbDropShadow)">
    <!-- Base 3D Extrusion Shadow -->
    <path
      d="M 610 388 C 672 388 742 404 782 444 C 828 490 822 550 772 590 C 832 636 848 706 802 766 C 756 826 676 846 590 846 C 564 846 538 842 518 836 L 534 790 C 554 796 574 800 594 800 C 660 800 720 780 750 735 C 780 690 760 645 700 645 L 634 645 L 634 595 L 690 595 C 740 595 766 565 750 525 C 735 485 684 468 628 468 C 608 468 588 474 574 478 L 564 428 C 578 424 598 418 618 418 Z"
      fill="#021e24"
      transform="translate(4, 8)"
    />

    <!-- Main "B" Shape Face -->
    <path
      d="M 610 388 C 672 388 742 404 782 444 C 828 490 822 550 772 590 C 832 636 848 706 802 766 C 756 826 676 846 590 846 C 564 846 538 842 518 836 L 534 790 C 554 796 574 800 594 800 C 660 800 720 780 750 735 C 780 690 760 645 700 645 L 634 645 L 634 595 L 690 595 C 740 595 766 565 750 525 C 735 485 684 468 628 468 C 608 468 588 474 574 478 L 564 428 C 578 424 598 418 618 418 Z"
      fill="url(#letterGrad)"
      stroke="#021c22"
      stroke-width="12"
      stroke-linejoin="round"
    />

    <!-- "B" Top Lobe Highlight -->
    <path
      d="M 630 434 C 676 434 736 450 746 496 C 756 530 730 556 690 556"
      stroke="#d8fcff"
      stroke-width="8"
      stroke-linecap="round"
      fill="none"
    />

    <!-- "B" Bottom Lobe Highlight -->
    <path
      d="M 644 614 L 704 614 C 754 614 774 654 750 704 C 730 744 676 766 620 766"
      stroke="#d8fcff"
      stroke-width="8"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- 7. THE ZIG-ZAG BULL MARKET MOMENTUM ARROW -->
  <g filter="url(#sbDropShadow)">
    <!-- 3D Shadow -->
    <path
      d="M 382 654 L 482 544 L 532 614 L 712 324 L 652 314 L 772 274 L 742 394 L 712 339 L 547 619 L 487 554 L 392 659 Z"
      fill="#011417"
      transform="translate(4, 6)"
    />

    <!-- Main Arrow Shaft and Head -->
    <path
      d="M 382 654 L 482 544 L 532 614 L 712 324 L 652 314 L 772 274 L 742 394 L 712 339 L 547 619 L 487 554 L 392 659 Z"
      fill="url(#arrowGrad)"
      stroke="#021519"
      stroke-width="12"
      stroke-linejoin="miter"
    />

    <!-- Razor Sharp Neon Highlight on Arrow Ridge -->
    <path
      d="M 392 652 L 484 550 L 534 614 L 722 316"
      stroke="url(#neonCyan)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Arrowhead Tip Gleam -->
    <polygon points="768,276 738,322 724,316" fill="#c8fcff" opacity="0.8" />
  </g>
</svg>