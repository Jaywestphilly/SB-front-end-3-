  <path
    d="M 215 310 L 275 250 L 315 285 L 382 195 L 358 190 L 418 168 L 402 232 L 388 208 L 322 298 L 278 262 L 222 320 Z"
    fill="#15434e"
    stroke="#0b242a"
    strokeWidth="3"
